name: Release

# Releases are published only from `main`. The version is an explicit
# developer edit in the Rust workspace manifest — there is no automatic bump.
# This workflow reads it, compares it with the last git tag, and only builds
# and publishes when the version actually moved.
on:
  push:
    branches: [main]
    paths:
      - "rust/**"
      - ".github/workflows/release.yml"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version-check:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare workspace version with latest tag
        id: check
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' rust/n8n-launcher-workspace/Cargo.toml | head -n 1)
          if [ -z "$version" ]; then
            echo "Could not read the workspace version" >&2
            exit 1
          fi
          last_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$last_tag" ] && [ "$last_tag" = "v$version" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version-check
    if: needs.version-check.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: n8n-launcher-linux
            binary: n8n-launcher
          - os: macos-latest
            name: n8n-launcher-macos
            binary: n8n-launcher
          - os: windows-latest
            name: n8n-launcher-windows
            binary: n8n-launcher.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust/n8n-launcher-workspace
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/n8n-launcher-workspace
      - name: Build release binary
        run: cargo build --workspace --release
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: rust/n8n-launcher-workspace/target/release/${{ matrix.binary }}
          if-no-files-found: error

  release:
    needs: [version-check, build]
    if: needs.version-check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version-check.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: artifacts/**/*
