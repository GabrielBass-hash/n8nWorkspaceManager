name: Release

# Releases are published only from `main`. A version bump is an explicit
# developer action (``scripts/bump_version.py``, committed as part of a PR):
# this workflow reads the version out of the single source of truth
# (``src/n8n_launcher/__init__.py``), compares it with the last git tag, and
# only tags + builds + publishes when the version actually moved. There is no
# automatic bump and no reliance on a ``[skip ci]`` convention.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "scripts/**"
      - "run.py"
      - ".github/workflows/release.yml"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version-check:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compare source version with latest tag
        id: check
        run: |
          version=$(PYTHONPATH=src python -c "import n8n_launcher; print(n8n_launcher.__version__)")
          last_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$last_tag" ] && [ "$last_tag" = "v$version" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version-check
    if: needs.version-check.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: dist/n8n-launcher-macos.dmg
            name: n8n-launcher-macos.dmg
          - os: ubuntu-latest
            artifact: dist/n8n-launcher
            name: n8n-launcher-linux
          - os: windows-latest
            artifact: dist/n8n-launcher.exe
            name: n8n-launcher-windows.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -e '.[test,packaging]'

      - name: Build executable
        run: python scripts/build.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    needs: [version-check, build]
    if: needs.version-check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version-check.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: artifacts/**/*