name: Release

on:
  push:
    branches: [dev, main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "scripts/**"
      - "run.py"
      - ".github/workflows/release.yml"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump-version:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine bump type
        id: bump-type
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          else
            echo "type=minor" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version
        id: bump
        run: |
          python scripts/bump_version.py "${{ steps.bump-type.outputs.type }}"
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "new_version=$version" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: bump version to ${{ steps.bump.outputs.new_version }} [skip ci]"
          branch: ${{ github.ref_name }}

      - name: Create and push tag
        run: |
          git tag "v${{ steps.bump.outputs.new_version }}"
          git push origin "v${{ steps.bump.outputs.new_version }}"

  build:
    needs: bump-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: dist/n8n-launcher-macos.dmg
            name: n8n-launcher-macos.dmg
          - os: ubuntu-latest
            artifact: dist/n8n-launcher
            name: n8n-launcher-linux
          - os: windows-latest
            artifact: dist/n8n-launcher.exe
            name: n8n-launcher-windows.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/v${{ needs.bump-version.outputs.new_version }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -e '.[test,packaging]'

      - name: Build executable
        run: python scripts/build.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    needs: [bump-version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.bump-version.outputs.new_version }}
          files: artifacts/**/*
          generate_release_notes: true