name: CI

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/**"
      - "run.py"
      - "assets/**"
      - ".pre-commit-config.yaml"
      - ".gitignore"
      - ".python-version"
      - "README.md"
      - "AGENTS.md"
      - ".github/workflows/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Typecheck (basedpyright)
        run: uv run basedpyright

  test:
    needs: lint
    strategy:
      # Three OSes must all report their result even if one of them fails.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            os_name: linux
          - os: macos-latest
            os_name: macos
          - os: windows-latest
            os_name: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      # Qt links against these even on the offscreen platform plugin and the
      # GitHub Linux image does not guarantee them; without them importing
      # QApplication fails at load time rather than inside a test assertion.
      - name: Install Qt runtime libraries (Linux)
        if: matrix.os_name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Install dependencies
        run: uv sync --frozen

      # The suite now imports Qt, but only through ``src/n8n_launcher/gui/`` and
      # only with the offscreen platform plugin, so there is no X server and no
      # ``xvfb`` to install. The coverage floor is kept where it was — headless
      # does not mean untested.
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest --cov-fail-under=80 --junitxml=pytest-report-${{ matrix.os_name }}.xml

      - name: Run blocking responsive GUI tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest tests/unit/gui/test_responsive.py -m responsive --junitxml=responsive-report-${{ matrix.os_name }}.xml

      - name: Upload pytest report
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-${{ matrix.os_name }}
          path: pytest-report-${{ matrix.os_name }}.xml
          if-no-files-found: error

      - name: Upload responsive report
        uses: actions/upload-artifact@v4
        with:
          name: responsive-report-${{ matrix.os_name }}
          path: responsive-report-${{ matrix.os_name }}.xml
          if-no-files-found: error

  integration:
    # The remote-deployment flow (install_server/publish/hook) and the remote
    # execution-status contract are the code most likely to ship a silent bug to
    # production, and they can only run end to end when Docker is present.
    # Linux-only on purpose: the sshd sandbox is a Linux container and the
    # harness reaches the deployed n8n through an SSH reverse tunnel, which is
    # proven here but not on the macOS/Windows runners. What the harness needs
    # from the runner: a Docker daemon (its socket is the default
    # ``/var/run/docker.sock``, so no N8N_LAUNCHER_TEST_DOCKER_SOCKET override),
    # the ``ssh`` client used to open that tunnel (preinstalled), and a free
    # ephemeral port for the sandbox's sshd bridge. Unit runs keep excluding
    # these via ``-m 'not integration'``.
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run integration tests
        run: uv run pytest tests/integration -m integration --junitxml=pytest-report-integration.xml
        timeout-minutes: 60

      - name: Upload pytest report
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-integration
          path: pytest-report-integration.xml
          if-no-files-found: error

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: dist/n8n-launcher-macos.dmg
            dist_root: dist/n8n-launcher.app
          - os: ubuntu-latest
            artifact: dist/n8n-launcher
            dist_root: dist/n8n-launcher
          - os: windows-latest
            artifact: dist/n8n-launcher
            dist_root: dist/n8n-launcher
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --no-group dev --group packaging

      - name: Build executable
        run: uv run python scripts/build.py

      # A bundle without its Qt platform plugin starts and dies with no window,
      # which stays invisible until a user tries it: assert it here instead.
      - name: Verify the Qt bundle
        run: uv run python scripts/build.py --verify "${{ matrix.dist_root }}"

      - name: Build AppImage (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: bash scripts/build_appimage.sh

      - name: Smoke test the built application (Linux)
        if: matrix.os == 'ubuntu-latest'
        env:
          QT_QPA_PLATFORM: offscreen
        run: dist/n8n-launcher/n8n-launcher --self-test

      - name: Smoke test the AppImage (Linux)
        if: matrix.os == 'ubuntu-latest'
        env:
          QT_QPA_PLATFORM: offscreen
        run: dist/n8n-launcher-linux-x86_64.AppImage --self-test

      - name: Smoke test the built application (macOS)
        if: matrix.os == 'macos-latest'
        run: dist/n8n-launcher.app/Contents/MacOS/n8n-launcher --self-test

      # A --windowed build on Windows is a GUI-subsystem binary: PowerShell does
      # not wait for it and never sees its exit code, hence Start-Process -Wait.
      - name: Smoke test the built application (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $exe = "dist\n8n-launcher\n8n-launcher.exe"
          $proc = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "self-test exited with $($proc.ExitCode)" }

      - name: Dry-run the macOS installer
        if: matrix.os == 'macos-latest'
        run: bash scripts/install_macos.sh -n -f dist/n8n-launcher-macos.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: n8n-launcher-${{ runner.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

      - name: Upload AppImage artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: n8n-launcher-ubuntu.AppImage
          path: dist/n8n-launcher-linux-x86_64.AppImage
          if-no-files-found: error
