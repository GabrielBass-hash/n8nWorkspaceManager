name: CI

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "scripts/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run lint
        run: uv run ruff check .

      - name: Run format check
        run: uv run ruff format --check .

      - name: Run type check
        run: uv run basedpyright

      - name: Run unit tests
        run: uv run pytest

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: dist/n8n-launcher-macos.dmg
          - os: ubuntu-latest
            artifact: dist/n8n-launcher
          - os: windows-latest
            artifact: dist/n8n-launcher.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group packaging

      - name: Build executable
        run: uv run python scripts/build.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: n8n-launcher-${{ runner.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
