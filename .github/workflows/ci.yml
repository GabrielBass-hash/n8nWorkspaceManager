name: CI

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/**"
      - "run.py"
      - "assets/**"
      - ".pre-commit-config.yaml"
      - ".gitignore"
      - ".python-version"
      - "README.md"
      - "AGENTS.md"
      - ".github/workflows/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      # The GUI imports ``tkinter`` at module level. uv's managed CPython bundles
      # Tk, but if uv ever resolves a bare system CPython (no ``python3-tk``),
      # collection would error instead of running the GUI suite — install it so
      # the ubuntu matrix leg always runs those tests.
      - name: Install tkinter (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run pre-commit (lint, format, typecheck)
        run: uv run pre-commit run --all-files

      - name: Run unit tests
        run: uv run pytest --cov-fail-under=80

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: dist/n8n-launcher-macos.dmg
          - os: ubuntu-latest
            artifact: dist/n8n-launcher
          - os: windows-latest
            artifact: dist/n8n-launcher.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --no-group dev --group packaging

      - name: Build executable
        run: uv run python scripts/build.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: n8n-launcher-${{ runner.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
